[package]
name = "wgpui-compat"
version = "0.1.0"
edition = "2024"
publish = false
autoexamples = false

[lib]
name = "gpui"
path = "src/gpui.rs"
doctest = false

[dependencies]
wgpui-core = { path = "../wgpui-core" }
wgpui-layout = { path = "../wgpui-layout" }
wgpui-text = { path = "../wgpui-text" }
wgpui-widgets = { path = "../wgpui-widgets" }
wgpui-wgpu = { path = "../wgpui-wgpu" }
anyhow = "1.0.86"
futures = "0.3"
log = "0.4.16"
rand = "0.10"
glam = "0.33"
bytemuck = { version = "1.24", features = ["derive"] }
env_logger = "0.11"
unicode-segmentation = "1.10"
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl"] }
helio = { git = "https://github.com/Far-Beyond-Pulsar/Helio", rev = "04a38328c6d1329272072ade89d07098737df6b8" }
helio-default-graphs = { git = "https://github.com/Far-Beyond-Pulsar/Helio", rev = "04a38328c6d1329272072ade89d07098737df6b8" }

