[package]
name = "wgpui-devtools"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
render-stats = []
flamegraph = ["render-stats"]
inspector = []
perf-ab = ["render-stats"]

[lib]
name = "wgpui_devtools"
path = "src/wgpui_devtools.rs"
doctest = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpui-core = { path = "../wgpui-core" }

[lints.rust]
unexpected_cfgs = { level = "allow" }
