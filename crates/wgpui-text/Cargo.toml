[package]
name = "wgpui-text"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "wgpui_text"
path = "src/wgpui_text.rs"
doctest = false

[dependencies]
# §6: "Text shaping stays on the CPU, via `cosmic-text`, unchanged." Not a new
# dependency for the project — the legacy backend already shapes through it
# (`src/platform/cross/text_system.rs`), pinned to the same version here so the
# two agree about glyph ids, metrics, and fallback behaviour while both exist.
cosmic-text = "0.18.2"
# Shaped runs become `GlyphRun`/`Glyph` patch payloads (§2), and glyph rasters
# become atlas tile references the scene tracks for eviction (R-N §4.3). The
# edge runs one way: `wgpui-core` names nothing here.
wgpui-core = { path = "../wgpui-core" }

[dev-dependencies]
# `tests/legacy_raster_differential.rs` transcribes the legacy rasteriser and
# runs it against its own `FontSystem`/`SwashCache`, so the oracle needs the same
# crate the port does. An integration test does not inherit `[dependencies]`, and
# the legacy path itself is unreachable (`RenderGlyphParams` is `pub(crate)` in
# `gpui-ce`), so this is what a differential against it costs. Same version — no
# new package in the lockfile.
cosmic-text = "0.18.2"

[lints.rust]
unexpected_cfgs = { level = "allow" }
