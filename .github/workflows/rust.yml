name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --yes \
          libfontconfig-dev \
          libwayland-dev \
          libx11-xcb-dev \
          libxkbcommon-x11-dev \
          libvulkan1 \
          mesa-vulkan-drivers \
          vulkan-tools
    - name: Check software Vulkan adapter
      env:
        XDG_RUNTIME_DIR: ${{ runner.temp }}
      run: vulkaninfo --summary
    - name: Build
      run: cargo build --verbose --locked
    - name: Run tests
      env:
        XDG_RUNTIME_DIR: ${{ runner.temp }}
      run: cargo test --verbose --locked -- --test-threads=1
